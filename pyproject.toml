[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "password-cracker"
version = "1.0.0"
description = "A Flask web app that cracks password hashes offline using a dictionary attack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask",
    "passlib",
    "bcrypt",
    "argon2-cffi",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["cracker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
